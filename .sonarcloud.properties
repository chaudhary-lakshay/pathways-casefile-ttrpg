# SonarCloud Automatic Analysis settings.
# parity/ generates test vectors from fixed seeds; its complexity is not product code.
sonar.exclusions=web-demo/parity/**

# The web-demo test files register their cases through replay(), which S2187 cannot see.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e1.resourceKey=web-demo/src/test/**

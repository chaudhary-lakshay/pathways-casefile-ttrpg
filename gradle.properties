# Added when the daemon began failing with "the JVM garbage collector is
# thrashing" while dexing material-icons-extended, which ships thousands of
# vector assets. The default heap is not enough for that on this machine, and
# the failure reads like a compile error until you get to the message.
# 2g, not 3g: with an emulator running this machine could not allocate 3g and
# the daemon was killed outright, which reports as "daemon disappeared".
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true

# Required by Compose; AGP warns when it is not explicit.
android.useAndroidX=true

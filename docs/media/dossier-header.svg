    <text x="1144" y="55" text-anchor="end" font-family="monospace" letter-spacing="1.5" font-size="10" fill="#c3a99c">OFFLINE • ANDROID</text>
    <path d="M61 117H711" stroke="#998771" stroke-width="1"/>
    <text x="63" y="108" font-family="monospace" font-size="12" letter-spacing="3.5" fill="#81433c">SUBJECT: TABLETOP ROLEPLAYING ASSISTANCE</text>
    <text x="53" y="237" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="112" fill="#242927">PATHWAYS</text>

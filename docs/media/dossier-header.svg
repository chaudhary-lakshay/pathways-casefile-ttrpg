<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="445" viewBox="0 0 1200 445" role="img" aria-labelledby="title desc">
  <title id="title">Pathways — Classified Beyonder Dossier</title>
  <desc id="desc">An archival-style cover for the Pathways fan-made offline Android tabletop RPG companion.</desc>
  <defs>
    <pattern id="paper" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 6.5H7" stroke="#a8957b" stroke-width=".35" opacity=".28"/></pattern>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#635746" stroke-width=".5" opacity=".15"/></pattern>
    <clipPath id="page"><rect width="1200" height="445" rx="2"/></clipPath>
  </defs>
  <g clip-path="url(#page)">
